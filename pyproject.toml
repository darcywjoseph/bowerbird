[project]
name = "bowerbird"
version = "0.0.1"
description = "Score robot demonstrations and turn the scores into a ready-to-train dataset."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["robotics", "imitation-learning", "data-curation", "lerobot"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["av>=12", "huggingface-hub>=0.25", "numpy>=1.26", "pyarrow>=15"]

[project.scripts]
bowerbird = "bowerbird.cli:main"

[project.urls]
Repository = "https://github.com/darcywjoseph/bowerbird"
Issues = "https://github.com/darcywjoseph/bowerbird/issues"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "B", "UP", "SIM", "RUF"]

ignore = ["D105"]  # Magic methods need no docstring.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to the Hugging Face Hub"]
addopts = "-m 'not network'"
