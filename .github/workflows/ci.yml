name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  # The benchmark needs the simulator and training libraries, which the other
  # jobs do not install. Its tests train nothing and need no GPU.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra bench
      - run: uv run pytest tests/test_bench_robomimic.py tests/test_bench_runs.py tests/test_bench_faults.py tests/test_bench_statistics.py tests/test_bench_simulator.py

  # The plan's target: from install to a quality report in under five minutes,
  # on a machine with no GPU, with one command. The job's time limit is the test.
  install-to-report:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.10"
      - name: Install into a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/fresh"
          uv pip install --python "$RUNNER_TEMP/fresh" .
      - name: Score a Hub dataset
        working-directory: ${{ runner.temp }}
        run: |
          fresh/bin/bowerbird score lerobot/pusht
          test -s bowerbird-report.html
          fresh/bin/bowerbird show lerobot/pusht --worst 5
